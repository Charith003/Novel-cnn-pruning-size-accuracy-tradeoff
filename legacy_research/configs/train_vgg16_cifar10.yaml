# VGG-16-BN on CIFAR-10 — Training Configuration
# Reference accuracy target: ~93.5% top-1

arch: vgg16
dataset: cifar10
data_root: ./data

epochs: 200
batch_size: 128
lr: 0.05          # VGG-BN benefits from a slightly lower initial LR
min_lr: 0.0
momentum: 0.9
weight_decay: 0.0005   # Higher L2 for the large VGG parameter count
nesterov: true
lr_schedule: cosine

seed: 42
num_workers: 4

checkpoint_dir: ./checkpoints
results_dir: ./results
