# VGG-16-BN on Custom Dataset — Training Configuration

arch: vgg16
dataset: custom
data_root: ./data/custom   # <-- CHANGE THIS to your dataset root

epochs: 200
batch_size: 128
lr: 0.05
min_lr: 0.0
momentum: 0.9
weight_decay: 0.0005
nesterov: true
lr_schedule: cosine
image_size: 32

seed: 42
num_workers: 4

checkpoint_dir: ./checkpoints
results_dir: ./results
